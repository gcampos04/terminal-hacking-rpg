<!doctype html>
<html lang="pt-BR">
<head>

<style>
:root{--p:#ff2a6d;--t:#05d9e8;--f:#0b0614;--s:#150b24;--b:#3b2358;--ok:#39ff88;--alerta:#ffb000;--perigo:#ff3b3b;--fonte:"Cascadia Mono","Cascadia Code",Consolas,"DejaVu Sans Mono",Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--f);color:var(--t);font:15px/1.5 var(--fonte);overflow:hidden}
html[data-atmos=aviso] body{--p:#ffb000;--t:#ffd98a;--b:#6a4a10}
html[data-atmos=critico] body{--p:#ff3b3b;--t:#ffb3b3;--b:#6e1c1c}
html[data-atmos=critico] .tela{animation:pulso 1.2s infinite}
@keyframes pulso{50%{box-shadow:inset 0 0 90px rgba(255,40,40,.4)}}
html[data-glitch="1"] #app,html[data-glitch="1"] #modal{animation:glitch .22s steps(2) infinite}
@keyframes glitch{0%{transform:translate(2px,-1px) skewX(1deg);filter:hue-rotate(40deg)}50%{transform:translate(-3px,1px);filter:invert(.12)}100%{transform:translate(1px,2px) skewX(-1deg)}}
html:not([data-mestre="1"])[data-crt=leve] body::after,html:not([data-mestre="1"])[data-crt=pesado] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45))}
html:not([data-mestre="1"])[data-crt=pesado] body::after{background:repeating-linear-gradient(0deg,rgba(0,0,0,.38) 0 2px,transparent 2px 4px),radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.7))}
html:not([data-mestre="1"])[data-sinal=leve] body::before,html:not([data-mestre="1"])[data-sinal=pesado] body::before{content:"";position:fixed;inset:-40px;pointer-events:none;z-index:49;opacity:.07;background:repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 7px),repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 5px);animation:ruido .25s steps(3) infinite}
html:not([data-mestre="1"])[data-sinal=pesado] body::before{opacity:.18}
@keyframes ruido{33%{transform:translate(9px,-7px)}66%{transform:translate(-13px,5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--s);border:1px solid var(--b);padding:7px 12px;cursor:pointer;border-radius:3px}

button:disabled{opacity:.45;cursor:not-allowed}

.pilha{display:grid;gap:12px;align-content:start}
.arvore{--guia:color-mix(in srgb,var(--t) 50%,transparent);--meio:15px}
.arv-acoes{display:flex;gap:6px;margin:0 0 8px}

.guia.t::after,.guia.l::after{content:"";position:absolute;left:8px;right:0;top:var(--meio);border-top:1px dotted var(--guia)}

.no-arv .nm{flex:1 1 auto;min-width:80px;padding:5px 8px 5px 4px;line-height:20px;overflow-wrap:anywhere}

.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.campo{display:grid;gap:3px;align-content:start}

.chk input{width:auto}
fieldset{border:1px solid var(--b);padding:12px;margin:12px 0 0;min-width:0}
legend{color:var(--p);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:0 6px}
.vivo-no{display:grid;gap:6px;padding:9px 0;border-bottom:1px dashed var(--b)}
.vivo-no .cab{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.vivo-no .cab b{flex:1;min-width:130px}
.vivo-no .resp{font-size:12.5px;color:var(--alerta);overflow-wrap:anywhere}
.vivo-no .btns{display:flex;gap:5px;flex-wrap:wrap}
.vivo-no .btns button{padding:3px 8px;font-size:12.5px}
.pill{font-size:11px;border:1px solid var(--b);padding:0 6px;letter-spacing:.06em}

.alerta-no{border:1px solid var(--alerta);color:var(--alerta);padding:8px 10px;margin-bottom:12px;font-size:13.5px}
.erro-carga{padding:30px;max-width:640px;margin:auto}
@media (max-width:760px){.m-corpo{grid-template-columns:1fr;grid-auto-rows:max-content;overflow:auto}.tela{padding:8px}body{overflow:auto}.painel{overflow:visible;min-height:auto}}
</style>

<script id="puzzles">
(function (g) {
  'use strict';
  const ALEA = () => Math.random();
  const int = (n) => Math.floor(ALEA() * n);
  const entre = (a, b) => a + int(b - a + 1);
  const escolhe = (l) => l[int(l.length)];
  const mistura = (l) => { const c = [...l]; for (let i = c.length - 1; i > 0; i--) { const j = int(i + 1); [c[i], c[j]] = [c[j], c[i]]; } return c; };

  const DIFICULDADES = ['facil', 'normal', 'dificil', 'expert'];
  const TABELA = {
    breach: { facil: { n: 4, buffer: 5, seqs: 2, len: [2, 2] }, normal: { n: 5, buffer: 5, seqs: 2, len: [2, 3] }, dificil: { n: 5, buffer: 5, seqs: 3, len: [3, 3] }, expert: { n: 6, buffer: 5, seqs: 3, len: [3, 4] } },
    palavras: { facil: { len: [4, 5], qtd: 6, pares: 4 }, normal: { len: [5, 6], qtd: 7, pares: 3 }, dificil: { len: [6, 8], qtd: 8, pares: 2 }, expert: { len: [8, 10], qtd: 9, pares: 1 } },
    circuito: { facil: { n: 4, alvos: 1 }, normal: { n: 5, alvos: 1 }, dificil: { n: 5, alvos: 2 }, expert: { n: 6, alvos: 2 } },
    cripto: { facil: { erros: 8, dicas: 4 }, normal: { erros: 5, dicas: 3 }, dificil: { erros: 4, dicas: 2 }, expert: { erros: 3, dicas: 1 } },
    memoria: { facil: { n: 3, seq: 3, mostra: 600, pausa: 300 }, normal: { n: 4, seq: 4, mostra: 500, pausa: 250 }, dificil: { n: 4, seq: 6, mostra: 400, pausa: 200 }, expert: { n: 5, seq: 8, mostra: 350, pausa: 150 } }
  };

  const CODIGOS = ['A7', '3C', 'D1', '5E', 'F0', '9B', '2D', 'E4'];
  const BANCO = 'CHIP NODE DADO FIOS CODE HACK REDE LOGS NEON ROOT BYTE SCAN PORT DUMP CRED LINK MESH ZERO GRID CAOS ' +
    'SINAL PROXY CHAVE VIRUS TOKEN SETOR PIXEL ROTAS DADOS CYBER LOGIN SHELL LASER DRONE NUVEM CORPO TRAMA CLONE FALHA TURBO ' +
    'SERVER NEURAL CODIGO ACESSO BINARY DAEMON SOCKET CIFRAS MATRIZ SONDAS REATOR CAMERA BUFFER MEMORY TUNNEL FIBRAS ALARME PORTAL GLITCH ' +
    'SISTEMA CIRCUIT IMPLANT CONSOLE GATEWAY PACOTES ARQUIVO MONITOR SCANNER PAYLOAD ROUTERS SPECTRE VIGILIA NETWORK SEGREDO CONTROL ' +
    'FIREWALL BACKDOOR TERMINAL PROTOCOL CIRCUITO PASSWORD DATABASE MAINLINE OVERRIDE SENTINEL SOFTWARE HARDWARE CONEXOES IMPLANTE MALWARES BLACKOUT REPLICAS ' +
    'NETRUNNER MEGACORPO PROTOCOLO SEGURANCA MAINFRAME BIOMETRIA CYBERDECK NEUROLINK OPERADORA VIGILANTE INTRUSION SATELLITE CIBERNETA FIRMWARES PROGRAMAS TERMINAIS EVIDENCIA ' +
    'MEGACORPOS HOLOGRAMAS SENTINELAS CYBERSPACE DECRIPTADO ASSINATURA REPLICANTE VIGILANTES MICROCHIPS OPERADORES PROTOCOLOS FREQUENCIA INFORMANTE ENCRIPTADO MAINFRAMES CREDENCIAL SUBSISTEMA';
  const PALAVRAS = BANCO.split(' ');
  const FRASES = ['A CIDADE NUNCA ESQUECE SEU ROSTO', 'QUEM CONTROLA OS DADOS CONTROLA A RUA', 'O CONTRATO ERA UMA ARMADILHA', 'NINGUEM SAI LIMPO DA TORRE', 'A SENHA ESTA NO ANDAR DE BAIXO', 'NAO CONFIE NO SEU FIXER', 'O ALVO SABE QUE VOCES VIERAM', 'DESLIGUE AS CAMERAS ANTES DA MEIA NOITE', 'O CREDITO ACABA ANTES DA CHUVA', 'TODA REDE TEM UMA PORTA ESQUECIDA', 'A LUZ DE NEON ESCONDE O SANGUE', 'OS DRONES OBEDECEM AO MAIOR LANCE'];

  function normalizaTexto(t) {
    return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z ]/g, '').replace(/\s+/g, ' ').trim();
  }

  function caminhoBreach(n, buffer) {
    for (;;) {
      const cam = [[0, int(n)]];
      const usado = new Set([cam[0].join()]);
      let porColuna = true, preso = false;
      while (cam.length < buffer) {
        const [r, c] = cam[cam.length - 1];
        const op = [];
        for (let i = 0; i < n; i++) { const p = porColuna ? [i, c] : [r, i]; if (!usado.has(p.join())) op.push(p); }
        if (!op.length) { preso = true; break; }
        const p = escolhe(op);
        cam.push(p); usado.add(p.join()); porColuna = !porColuna;
      }
      if (!preso) return cam;
    }
  }

  function gerarBreach(d) {
    for (;;) {
      const grade = Array.from({ length: d.n }, () => Array.from({ length: d.n }, () => escolhe(CODIGOS)));
      const cam = caminhoBreach(d.n, d.buffer);
      const seq = cam.map(([r, c]) => grade[r][c]);
      const daemons = [], vistos = new Set();
      for (let t = 0; t < 60 && daemons.length < d.seqs; t++) {
        const len = entre(d.len[0], d.len[1]);
        const ini = int(d.buffer - len + 1);
        const s = seq.slice(ini, ini + len);
        if (!vistos.has(s.join())) { vistos.add(s.join()); daemons.push(s); }
      }
      if (daemons.length === d.seqs) return { tipo: 'breach', n: d.n, buffer: d.buffer, grade, daemons, caminho: cam, resposta: 'Sequência: ' + seq.join(' ') };
    }
  }

  function bufferContem(buf, seq) {
    for (let i = 0; i + seq.length <= buf.length; i++) if (seq.every((v, j) => buf[i + j] === v)) return true;
    return false;
  }

  function resolveBreach(p) {
    const passo = (buf, usados, r, c, porLinha) => {
      if (p.daemons.every((s) => bufferContem(buf, s))) return true;
      if (buf.length >= p.buffer) return false;
      for (let i = 0; i < p.n; i++) {
        const a = porLinha ? [r, i] : [i, c], k = a.join();
        if (usados.has(k)) continue;
        usados.add(k); buf.push(p.grade[a[0]][a[1]]);
        if (passo(buf, usados, a[0], a[1], !porLinha)) return true;
        buf.pop(); usados.delete(k);
      }
      return false;
    };
    return passo([], new Set(), 0, 0, true);
  }

  function gerarPalavras(d, alvoCru) {
    const alvoNorm = normalizaTexto(alvoCru).replace(/ /g, '');
    const alvoOk = alvoNorm.length >= 4 && alvoNorm.length <= 10;
    const len = alvoOk ? alvoNorm.length : entre(d.len[0], d.len[1]);
    const base = PALAVRAS.filter((p) => p.length === len && p !== alvoNorm);
    const alvo = alvoOk ? alvoNorm : escolhe(base);
    const outras = mistura(base.filter((p) => p !== alvo)).slice(0, d.qtd - 1);
    const palavras = mistura([alvo, ...outras]);
    const lixo = '!@#$%^&*-+=/\\|:;,.?~_';
    const fechar = { '[': ']', '(': ')', '{': '}', '<': '>' };
    const pares = Array.from({ length: d.pares }, () => {
      const a = escolhe(Object.keys(fechar));
      let m = ''; for (let i = entre(1, 4); i > 0; i--) m += lixo[int(lixo.length)];
      return a + m + fechar[a];
    });
    const fichas = mistura([...palavras.map((w) => ({ t: 'w', v: w })), ...pares.map((v) => ({ t: 'b', v }))]);
    const total = 28 * 12;
    let sobra = total - fichas.reduce((s, f) => s + f.v.length, 0);
    const lacunas = new Array(fichas.length + 1).fill(0);
    const minimo = Math.min(2, Math.floor(sobra / lacunas.length));
    lacunas.forEach((_, i) => { lacunas[i] = minimo; }); sobra -= minimo * lacunas.length;
